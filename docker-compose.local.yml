# Use only for a local browser on this machine. Never publish this profile to a LAN.
services:
  backend:
    environment:
      APP_ENV: development
      HOME_LIBRARY_APP_VERSION: 0.1.1-local
      SERVER_CONFIG_ALLOW_LOOPBACK_PROXY: "true"
    volumes:
      - ./backend/app:/app/backend/app:ro

  frontend:
    ports: !override
      - "127.0.0.1:${LOCAL_HTTP_PORT:-80}:80"
