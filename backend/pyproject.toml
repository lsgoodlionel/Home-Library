[project]
name = "home-library-backend"
version = "0.1.0"
description = "FastAPI backend for the Home Library application."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "bcrypt>=3.2,<4.0",
  "fastapi>=0.115.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.8.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
