services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: sqlite:////data/home_library.sqlite3
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPGRADE_PASSWORD: ${UPGRADE_PASSWORD:-}
      UPGRADE_COMMAND: ${UPGRADE_COMMAND:-}
      UPGRADE_WORKDIR: ${UPGRADE_WORKDIR:-/app}
      UPGRADE_TIMEOUT_SECONDS: ${UPGRADE_TIMEOUT_SECONDS:-900}
    volumes:
      - db_data:/data
      - uploads:/uploads
      - backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads:/uploads:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_library}
      POSTGRES_USER: ${POSTGRES_USER:-home_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home_library} -d ${POSTGRES_DB:-home_library}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  backups:
  ollama_data:
  postgres_data:
