services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - .env
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: sqlite:////data/home_library.sqlite3
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-https://openclaw.lsgood.cn}
      OLLAMA_TRUSTED_BASE_URL: ${OLLAMA_TRUSTED_BASE_URL:-https://openclaw.lsgood.cn}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen3.5:4b}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-20}
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-180}
      OLLAMA_VERIFY_TLS: ${OLLAMA_VERIFY_TLS:-true}
      OLLAMA_CF_ACCESS_CLIENT_ID: ${OLLAMA_CF_ACCESS_CLIENT_ID:-}
      OLLAMA_CF_ACCESS_CLIENT_SECRET: ${OLLAMA_CF_ACCESS_CLIENT_SECRET:-}
      UPGRADE_PASSWORD: ${UPGRADE_PASSWORD:-}
      UPGRADE_COMMAND: ${UPGRADE_COMMAND:-}
      UPGRADE_WORKDIR: /host-project
      UPGRADE_TIMEOUT_SECONDS: ${UPGRADE_TIMEOUT_SECONDS:-900}
    volumes:
      - db_data:/data
      - uploads:/uploads
      - backups:/backups
      # 升级功能所需：挂载宿主机项目目录和 Docker socket
      # 需在 .env 中设置 HOST_PROJECT_DIR 为项目实际安装路径
      - ${HOST_PROJECT_DIR:-/tmp}:/host-project
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads:/uploads:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_library}
      POSTGRES_USER: ${POSTGRES_USER:-home_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home_library} -d ${POSTGRES_DB:-home_library}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  backups:
  ollama_data:
  postgres_data:
