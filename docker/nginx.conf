server {
    listen 80;
    server_name _;

    # Increase max upload size to match backend setting (default 10 MB)
    client_max_body_size 10m;

    # ── Frontend static files ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all non-file routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API reverse proxy ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger bodies for file uploads
        client_max_body_size 10m;

        # Timeout settings for long-running AI requests
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Uploaded files (served directly by Nginx for performance) ─────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
}
